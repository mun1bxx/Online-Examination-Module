<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">NexaCorp Global Assessment</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --secondary: #06b6d4;
            --accent: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --slate: #475569;
            --light-bg: #f1f5f9;
            --white: #ffffff;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            margin: 0;
            background: radial-gradient(circle at top left, #e0e7ff 0%, #f1f5f9 45%, #cffafe 100%);
            min-height: 100vh;
            color: var(--dark);
        }
        /* Top Enterprise Navbar */
        .navbar {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(12px);
            padding: 0 6%;
            height: 74px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--white);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: -0.5px;
        }
        .brand-badge {
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--white);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 10px 18px;
            border-radius: 8px;
            transition: all 0.25s ease;
        }
        .nav-links a:hover {
            color: var(--white);
            background: rgba(255, 255, 255, 0.1);
        }
        .nav-cta {
            background: linear-gradient(135deg, var(--primary), var(--accent)) !important;
            color: var(--white) !important;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }
        .nav-logout {
            background: linear-gradient(135deg, #ef4444, #dc2626) !important;
            color: var(--white) !important;
        }

        /* Split-Screen Enterprise Card */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 74px);
            padding: 40px 20px;
        }
        .split-card {
            display: flex;
            width: 100%;
            max-width: 980px;
            background: var(--white);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
        .split-Side {
            flex: 1.05;
            background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 55%, #06b6d4 100%);
            color: var(--white);
            padding: 52px 44px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .pill-tag {
            display: inline-block;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }
        .split-Side h2 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 16px 0;
            line-height: 1.2;
        }
        .split-Side p {
            color: rgba(255, 255, 255, 0.88);
            font-size: 1.02rem;
            line-height: 1.65;
            margin: 0 0 28px 0;
        }
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .feature-list li {
            margin-bottom: 12px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .feature-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.25);
            border: 1px solid #34d399;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #6ee7b7;
        }
        .split-form {
            flex: 1;
            padding: 52px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .split-form h3 {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 6px 0;
            color: var(--dark);
        }
        .subtitle {
            color: var(--slate);
            font-size: 0.95rem;
            margin: 0 0 28px 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.98rem;
            font-family: inherit;
            background: #f8fafc;
            color: var(--dark);
            transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }
        .form-row-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: -6px 0 22px 0;
            font-size: 0.9rem;
        }
        .link-accent {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }
        .link-accent:hover {
            text-decoration: underline;
        }
        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
        }
        .btn-clear {
            width: 100%;
            padding: 13px 24px;
            margin-top: 14px;
            background: var(--white);
            color: var(--slate);
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-clear:hover {
            background: #f1f5f9;
            color: var(--dark);
            border-color: #94a3b8;
        }
        .alert-error {
            background: #fef2f2;
            border-left: 4px solid var(--danger);
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #ecfdf5;
            border-left: 4px solid var(--success);
            color: #047857;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        @media (max-width: 820px) {
            .split-card { flex-direction: column; }
            .split-Side, .split-form { padding: 36px 28px; }
        }
    </style>
</head>
<body>
<!-- Public Enterprise Navigation -->
<nav th:fragment="navbar" class="navbar">
    <a href="/home" class="nav-brand">
        <span class="brand-badge">NX</span>
        <span>NexaCorp Exams</span>
    </a>
    <div class="nav-links">
        <a href="/home">Home</a>
        <a href="/contact">Support</a>
        <a href="/login">Sign In</a>
        <a href="/register" class="nav-cta">Create Account</a>
    </div>
</nav>

<!-- Authenticated Student/Employee Navigation -->
<nav th:fragment="dashboard-navbar" class="navbar">
    <a href="/dashboard" class="nav-brand">
        <span class="brand-badge">NX</span>
        <span>NexaCorp Workspace</span>
    </a>
    <div class="nav-links">
        <a href="/dashboard">Overview</a>
        <a href="/admin/create-exam">Create Exam</a>
        <a href="/contact">Help Desk</a>
        <a href="/logout" class="nav-logout">Log Out</a>
    </div>
</nav>
</body>
</html>
